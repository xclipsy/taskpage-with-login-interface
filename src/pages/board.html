    <script>
      (function() {
        // 1. Session check & headers
        const loggedUser = JSON.parse(localStorage.getItem('user'));
        if (!loggedUser) {
          window.navigateTo('/login');
          return;
        }

        document.getElementById('header-user-name').innerText = loggedUser.name;
        document.getElementById('header-user-role').innerText = loggedUser.role;

        // Hide "New Task" button and "Manage Users" nav link for coders
        const createBtn = document.getElementById('create-task-btn');
        const adminNavLink = document.getElementById('admin-nav-link');
        if (loggedUser.role !== 'admin') {
          if (createBtn) createBtn.style.display = 'none';
          if (adminNavLink) adminNavLink.style.display = 'none';
        }

        // Logout handler
        document.getElementById('logout-btn').addEventListener('click', () => {
          localStorage.removeItem('user');
          window.navigateTo('/login');
        });

        // 2. Fetch users and tasks
        let allUsers = [];
        let allTasks = [];
        let searchQuery = "";

        async function initBoard() {
          await fetchUsers();
          await fetchTasks();
          setupEventListeners();
        }

        async function fetchUsers() {
          try {
            const res = await fetch('http://localhost:3000/users');
            if (res.ok) {
              allUsers = await res.json();
              const select = document.getElementById('task-user-select');
              select.innerHTML = allUsers.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
            }
          } catch (e) {
            console.error("Error fetching users:", e);
            throw e;
          }
        }

        async function fetchTasks() {
          try {
            const res = await fetch('http://localhost:3000/tasks');
            if (res.ok) {
              allTasks = await res.json();
              renderBoard();
            }
          } catch (e) {
            console.error("Error fetching tasks:", e);
            throw e;
          }
        }

        // 3. Render Kanban Board
        function renderBoard() {
          const columns = {
            'todo': document.getElementById('column-todo'),
            'in progress': document.getElementById('column-in-progress'),
            'in review': document.getElementById('column-in-review'),
            'done': document.getElementById('column-done')
          };

          const counts = {
            'todo': document.getElementById('count-todo'),
            'in progress': document.getElementById('count-in-progress'),
            'in review': document.getElementById('count-in-review'),
            'done': document.getElementById('count-done')
          };

          // Clear previous cards
          Object.values(columns).forEach(col => col.innerHTML = '');
          
          // Counters
          const columnCounts = { 'todo': 0, 'in progress': 0, 'in review': 0, 'done': 0 };

          // Filter by search query
          const filteredTasks = allTasks.filter(t => {
            if (!searchQuery) return true;
            const query = searchQuery.toLowerCase();
            const titleStr = (t.title || '').toLowerCase();
            const descStr = (t.description || '').toLowerCase();
            return titleStr.includes(query) || descStr.includes(query);
          });

          filteredTasks.forEach(task => {
            const status = task.status || 'todo';
            const colEl = columns[status];
            if (!colEl) return;

            columnCounts[status]++;

            // Find assigned user
            const assignedUser = allUsers.find(u => String(u.id) === String(task.userId)) || { name: 'Unassigned', role: 'coder' };
            const userName = assignedUser.name || 'Unassigned';
            const initials = userName.split(' ').filter(Boolean).map(n => n[0]).join('').toUpperCase().substring(0, 2);
            
            // Determine badges/categories dynamically (mocking category based on title/user role)
            let category = "Task";
            let categoryClass = "bg-secondary-container text-secondary";
            if (assignedUser.role === 'admin') {
              category = "Ops";
              categoryClass = "bg-secondary-container text-secondary";
            } else {
              const taskTitle = task.title || '';
              const hash = taskTitle.length % 3;
              if (hash === 0) {
                category = "Engineering";
                categoryClass = "bg-primary-fixed text-on-primary-fixed-variant";
              } else if (hash === 1) {
                category = "Design";
                categoryClass = "bg-primary-fixed text-on-primary-fixed-variant";
              } else {
                category = "Research";
                categoryClass = "bg-primary-fixed text-on-primary-fixed-variant";
              }
            }

            const isMe = String(task.userId) === String(loggedUser.id);
            const borderClass = isMe ? "border-l-4 border-l-primary border-outline-variant" : "border-outline-variant";

            const card = document.createElement('div');
            card.className = `task-card bg-surface border ${borderClass} rounded-xl p-md shadow-sm`;
            card.innerHTML = `
              <div class="flex items-start justify-between mb-xs">
                <span class="${categoryClass} px-2 py-0.5 rounded-full font-label-sm text-label-sm">${category}</span>
                ${isMe ? `<span class="bg-primary/10 text-primary text-[10px] font-semibold px-2 py-0.5 rounded-full">Assigned to me</span>` : ''}
              </div>
              <h4 class="font-label-md text-label-md text-on-surface mb-xs font-semibold">${escapeHTML(task.title)}</h4>
              <p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">${escapeHTML(task.description)}</p>
              <div class="mt-md flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <div class="w-6 h-6 rounded-full bg-primary-fixed text-on-primary-fixed-variant flex items-center justify-center font-bold text-[10px]" title="${escapeHTML(userName)}">
                    ${initials}
                  </div>
                  <span class="font-body-sm text-[12px] text-on-surface-variant">${escapeHTML(userName)}</span>
                </div>
                <span class="font-label-sm text-[11px] text-outline flex items-center gap-1">
                  <span class="material-symbols-outlined text-[14px]">schedule</span>
                  Active
                </span>
              </div>
            `;
            
            // Enable dragging if admin or owner of task
            const canDrag = loggedUser.role === 'admin' || isMe;
            if (canDrag) {
              card.setAttribute('draggable', 'true');
              card.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', task.id);
                setTimeout(() => card.classList.add('opacity-40'), 0);
              });
              card.addEventListener('dragend', () => {
                card.classList.remove('opacity-40');
              });
            }

            card.addEventListener('click', () => openModal(task));
            colEl.appendChild(card);
          });

          // Update counts
          Object.keys(counts).forEach(status => {
            if (counts[status]) {
              counts[status].innerText = columnCounts[status];
            }
          });
        }

        // Helper to escape HTML characters
        function escapeHTML(str) {
          if (!str) return '';
          return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
          );
        }

        // 4. Modal Interactions
        const modal = document.getElementById('task-modal');
        const form = document.getElementById('task-form');
        const modalTitle = document.getElementById('modal-title');
        const taskIdInput = document.getElementById('task-id');
        const titleInput = document.getElementById('task-title-input');
        const descInput = document.getElementById('task-desc-input');
        const statusSelect = document.getElementById('task-status-select');
        const userSelect = document.getElementById('task-user-select');
        const deleteBtn = document.getElementById('task-delete-btn');
        const saveBtn = document.getElementById('modal-save-btn');

        function openModal(task = null) {
          form.reset();
          modal.classList.remove('hidden');

          if (task) {
            // EDIT MODE
            taskIdInput.value = task.id;
            titleInput.value = task.title;
            descInput.value = task.description;
            statusSelect.value = task.status || 'todo';
            userSelect.value = task.userId;

            // Apply Role Rules
            if (loggedUser.role === 'admin') {
              modalTitle.innerText = "Edit Task";
              // Admin can edit everything
              titleInput.disabled = false;
              descInput.disabled = false;
              statusSelect.disabled = false;
              userSelect.disabled = false;
              deleteBtn.classList.remove('hidden');
              saveBtn.classList.remove('hidden');
            } else {
              // Coder
              const isAssignedToMe = String(task.userId) === String(loggedUser.id);
              if (isAssignedToMe) {
                modalTitle.innerText = "Edit Assigned Task";
                // Coder can edit status and description only
                titleInput.disabled = true;
                descInput.disabled = false;
                statusSelect.disabled = false;
                userSelect.disabled = true;
                deleteBtn.classList.add('hidden');
                saveBtn.classList.remove('hidden');
              } else {
                modalTitle.innerText = "View Task (Read-Only)";
                // Coder cannot edit other tasks
                titleInput.disabled = true;
                descInput.disabled = true;
                statusSelect.disabled = true;
                userSelect.disabled = true;
                deleteBtn.classList.add('hidden');
                saveBtn.classList.add('hidden');
              }
            }
          } else {
            // CREATE MODE (Only admins can reach this due to button hide)
            modalTitle.innerText = "Create New Task";
            taskIdInput.value = "";
            statusSelect.value = "todo"; // default status todo
            titleInput.disabled = false;
            descInput.disabled = false;
            statusSelect.disabled = true; // default todo and disabled as per acceptance criteria: status initial default 'todo'
            userSelect.disabled = false;
            deleteBtn.classList.add('hidden');
            saveBtn.classList.remove('hidden');
          }
        }

        function closeModal() {
          modal.classList.add('hidden');
        }

        // Setup Event Listeners
        function setupEventListeners() {
          // Setup column drop zones
          const columnsConfig = [
            { id: 'todo', el: document.getElementById('column-todo') },
            { id: 'in progress', el: document.getElementById('column-in-progress') },
            { id: 'in review', el: document.getElementById('column-in-review') },
            { id: 'done', el: document.getElementById('column-done') }
          ];

          columnsConfig.forEach(({ id: statusName, el }) => {
            if (!el) return;

            el.addEventListener('dragover', (e) => {
              e.preventDefault();
              el.classList.add('bg-primary/5');
            });

            el.addEventListener('dragleave', () => {
              el.classList.remove('bg-primary/5');
            });

            el.addEventListener('drop', async (e) => {
              e.preventDefault();
              el.classList.remove('bg-primary/5');
              
              const taskId = e.dataTransfer.getData('text/plain');
              if (!taskId) return;

              const task = allTasks.find(t => String(t.id) === String(taskId));
              if (!task) return;

              const canEdit = loggedUser.role === 'admin' || String(task.userId) === String(loggedUser.id);
              if (!canEdit) {
                alert("You do not have permission to move this task.");
                return;
              }

              if (task.status === statusName) return;

              try {
                const res = await fetch(`http://localhost:3000/tasks/${taskId}`, {
                  method: 'PATCH',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ status: statusName })
                });

                if (res.ok) {
                  task.status = statusName;
                  renderBoard();
                } else {
                  alert("Failed to update status on server.");
                }
              } catch (err) {
                console.error("Error patching drag status:", err);
                alert("Network error. Could not save status change.");
              }
            });
          });

          createBtn.addEventListener('click', () => openModal(null));
          document.getElementById('modal-close-btn').addEventListener('click', closeModal);
          document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);

          // Close modal clicking outside the container
          modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
          });

          // Search filtering
          document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderBoard();
          });

          // Handle form submit (save task)
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const taskId = taskIdInput.value;
            
            const taskData = {
              title: titleInput.value.trim(),
              description: descInput.value.trim(),
              status: statusSelect.value,
              userId: userSelect.value
            };

            try {
              let url = 'http://localhost:3000/tasks';
              let method = 'POST';

              if (taskId) {
                // Edit mode
                url = `http://localhost:3000/tasks/${taskId}`;
                method = 'PATCH';
                
                // For coder, keep original fields unmodified on server
                if (loggedUser.role !== 'admin') {
                  delete taskData.title;
                  delete taskData.userId;
                }
              } else {
                // Create mode - ensure status is todo
                taskData.status = 'todo';
              }

              const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(taskData)
              });

              if (res.ok) {
                closeModal();
                await fetchTasks();
              } else {
                alert("Failed to save the task.");
              }
            } catch (err) {
              console.error("Error saving task:", err);
              alert("Network error. Could not connect to API server.");
            }
          });

          // Handle Delete
          deleteBtn.addEventListener('click', async () => {
            const taskId = taskIdInput.value;
            if (!taskId) return;

            if (confirm("Are you sure you want to delete this task?")) {
              try {
                const res = await fetch(`http://localhost:3000/tasks/${taskId}`, {
                  method: 'DELETE'
                });

                if (res.ok) {
                  closeModal();
                  await fetchTasks();
                } else {
                  alert("Failed to delete the task.");
                }
              } catch (err) {
                console.error("Error deleting task:", err);
                alert("Network error. Could not connect to API server.");
              }
            }
          });
        }

        // Initialize board
        initBoard();
      })();
    </script>
  </body>
</html>
